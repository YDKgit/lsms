spring:
  application:
    name: lsms

  config:
    import: optional:classpath:application-local.yml

  datasource:
    url: jdbc:mysql://localhost:3306/lsms?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password:

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

# JWT (팀 공통 — 수정하지 말 것)
# - 로그인 API에서 JwtUtil.generateToken(userId, role)로 토큰 발급
# - 이후 요청: Authorization: Bearer {토큰}
# - 컨트롤러: request.getAttribute("loginUserId"), request.getAttribute("loginUserRole")
jwt:
  secret: lsms-secret-key-for-lab-safety-management-system-2026-team-project
  expiration: 86400000   # 24시간 (ms)

springdoc:
  swagger-ui:
    path: /swagger-ui.html

file:
  upload-dir: uploads